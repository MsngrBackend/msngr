---
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: Deploy vars

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Generate Self-Signed SSL Certificate
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
        run: |
          sudo apt-get update && sudo apt-get install -y openssl

          # Clean up any existing certificate directory issues
          rm -rf ./nginx-proxy/certs
          mkdir -p ./nginx-proxy/certs

          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout ./nginx-proxy/certs/key.pem \
            -out ./nginx-proxy/certs/cert.pem \
            -days 3650 \
            -subj "/C=US/ST=State/L=City/O=SelfSigned/CN=$PUBLIC_IP" \
            -addext "subjectAltName=IP:$PUBLIC_IP"

          cp ./nginx-proxy/certs/cert.pem ./nginx-proxy/certs/fullchain.pem
          chmod 644 ./nginx-proxy/certs/*.pem

          echo "Self-signed certificate generated for IP: $PUBLIC_IP"

      - name: Create .env files from secrets
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
        run: |
          # Auth Service .env
          cat > auth_service/.env <<'EOF'
          HTTP_PORT=8081
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=${{ secrets.AUTH_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.AUTH_POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.AUTH_POSTGRES_DB }}
          POSTGRES_SSLMODE=disable
          REDIS_ADDR=redis:6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DB=0
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_ACCESS_TTL=15m
          JWT_REFRESH_TTL=720h
          EMAIL_CODE_TTL=15m
          PROFILE_SERVICE_URL=http://profile-service:8082
          MESSAGE_SERVICE_URL=http://message-service:8000
          EOF

          # Message Service .env
          cat > message_service/.env <<'EOF'
          POSTGRES_DB=${{ secrets.MESSAGE_POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.MESSAGE_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.MESSAGE_POSTGRES_PASSWORD }}
          DATABASE_URL=postgres://${{ secrets.MESSAGE_POSTGRES_USER }}:${{ secrets.MESSAGE_POSTGRES_PASSWORD }}@messaging_postgres:5432/${{ secrets.MESSAGE_POSTGRES_DB }}
          NATS_URL=nats://msngr_nats:4222
          ENCRYPTION_SERVICE_ADDR=encryption-service:8081
          EOF

          # Profile Service .env
          cat > profile_service/.env <<'EOF'
          POSTGRES_USER=${{ secrets.PROFILE_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.PROFILE_POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.PROFILE_POSTGRES_DB }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          EOF

          # Encryption Service .env - Fixed: No default values in GitHub expressions
          cat > encryption_service/.env <<'EOF'
          ENCRYPTION_SERVICE_ADDR=:8081
          EOF
          
          # Add PostgreSQL config with fallback using bash syntax
          if [ -n "${{ secrets.ENCRYPTION_POSTGRES_USER }}" ]; then
            echo "POSTGRES_USER=${{ secrets.ENCRYPTION_POSTGRES_USER }}" >> encryption_service/.env
          else
            echo "POSTGRES_USER=postgres" >> encryption_service/.env
          fi
          
          if [ -n "${{ secrets.ENCRYPTION_POSTGRES_PASSWORD }}" ]; then
            echo "POSTGRES_PASSWORD=${{ secrets.ENCRYPTION_POSTGRES_PASSWORD }}" >> encryption_service/.env
          else
            echo "POSTGRES_PASSWORD=ultramegasecret" >> encryption_service/.env
          fi
          
          if [ -n "${{ secrets.ENCRYPTION_POSTGRES_DB }}" ]; then
            echo "POSTGRES_DB=${{ secrets.ENCRYPTION_POSTGRES_DB }}" >> encryption_service/.env
          else
            echo "POSTGRES_DB=messaging_db" >> encryption_service/.env
          fi
          
          # Build DATABASE_URL from the values
          PG_USER=$(grep '^POSTGRES_USER=' encryption_service/.env | cut -d'=' -f2)
          PG_PASS=$(grep '^POSTGRES_PASSWORD=' encryption_service/.env | cut -d'=' -f2)
          PG_DB=$(grep '^POSTGRES_DB=' encryption_service/.env | cut -d'=' -f2)
          echo "DATABASE_URL=postgres://${PG_USER}:${PG_PASS}@postgres:5432/${PG_DB}" >> encryption_service/.env

          # Frontend .env
          cat > frontend/.env <<EOF
          VITE_API_URL=
          VITE_WS_URL=wss://$PUBLIC_IP/api/v1/messages
          EOF

      - name: Create Docker network
        run: |
          docker network inspect msngr-network >/dev/null 2>&1 || docker network create msngr-network
          echo "✅ Docker network 'msngr-network' created"

      # - name: Deploy profile-service
      #   run: |
      #     cd profile_service
      #     docker compose down --remove-orphans || true
      #     docker compose up -d --build

      - name: Deploy message-service
        run: |
          cd message_service
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Deploy auth-service
        run: |
          cd auth_service
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Deploy frontend
        run: |
          cd frontend
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Deploy encryption
        run: |
          cd encryption_service
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30
          echo "Running containers:"
          docker ps --format "table {{.Names}}\t{{.Status}}"

      - name: Setup Nginx Reverse Proxy (After Services)
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
        run: |
          # Verify services are running
          if ! docker ps | grep -q auth-service-auth-1; then
            echo "ERROR: auth-service-auth-1 is not running"
            docker ps
            exit 1
          fi

          if ! docker ps | grep -q frontend-service-app-1; then
            echo "ERROR: frontend-service-app-1 is not running"
            docker ps
            exit 1
          fi

          if ! docker ps | grep -q message-service; then
            echo "ERROR: message-service is not running"
            docker ps
            exit 1
          fi

          # if ! docker ps | grep -q profile-service; then
          #   echo "ERROR: profile-service is not running"
          #   docker ps
          #   exit 1
          # fi

          # Clean up any existing conflicting files/directories
          rm -rf nginx-proxy/nginx.conf 2>/dev/null || true
          rm -rf nginx-proxy/nginx.conf.d 2>/dev/null || true

          # Ensure directory exists
          mkdir -p nginx-proxy

          # Create nginx.conf with CORS and all routes
          cat > nginx-proxy/nginx.conf <<'EOF'
          events {
              worker_connections 1024;
          }

          http {
              resolver 127.0.0.11 valid=30s;

              # CORS headers for all responses
              map $request_method $cors_headers {
                  default '';
                  OPTIONS 'true';
              }

              server {
                  listen 443 ssl;
                  http2 on;
                  server_name PUBLIC_IP_PLACEHOLDER;

                  ssl_certificate /etc/nginx/certs/fullchain.pem;
                  ssl_certificate_key /etc/nginx/certs/key.pem;

                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_ciphers HIGH:!aNULL:!MD5;

                  # Add CORS headers
                  add_header 'Access-Control-Allow-Origin' '*' always;
                  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                  add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                  add_header 'Access-Control-Allow-Credentials' 'true' always;

                  access_log /var/log/nginx/access.log;
                  error_log /var/log/nginx/error.log;

                  # Handle preflight OPTIONS requests
                  location /api/ {
                      if ($request_method = 'OPTIONS') {
                          add_header 'Access-Control-Allow-Origin' '*';
                          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                          add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                          add_header 'Access-Control-Max-Age' 86400;
                          add_header 'Content-Length' 0;
                          return 204;
                      }
                  }

                  # Auth Service API Gateway
                  location /api/v1/auth/ {
                      proxy_pass http://auth-service-auth-1:8081/api/v1/auth/;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_set_header Authorization $http_authorization;
                      proxy_pass_header Authorization;

                      # Pass CORS headers
                      proxy_pass_header Access-Control-Allow-Origin;
                  }

                  # # Profile Service
                  # location /api/v1/profile/ {
                  #     proxy_pass http://profile-service:8082/;
                  #     proxy_http_version 1.1;
                  #     proxy_set_header Host $host;
                  #     proxy_set_header X-Real-IP $remote_addr;
                  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  #     proxy_set_header X-Forwarded-Proto $scheme;
                  #     proxy_set_header Authorization $http_authorization;
                  #     proxy_pass_header Authorization;
                  # }

                  # Message Service (with WebSocket support)
                  location /api/v1/messages/ {
                      proxy_pass http://message-service:8000/;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_set_header Authorization $http_authorization;
                      proxy_pass_header Authorization;
                      
                      # WebSocket support
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection "upgrade";
                      proxy_read_timeout 86400;
                  }

                  # Frontend
                  location / {
                      proxy_pass http://frontend-service-app-1:80/;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }

              # Redirect HTTP to HTTPS
              server {
                  listen 80;
                  server_name PUBLIC_IP_PLACEHOLDER;
                  return 301 https://$server_name$request_uri;
              }
          }
          EOF

          # Replace placeholder with actual IP
          sed -i "s/PUBLIC_IP_PLACEHOLDER/$PUBLIC_IP/g" nginx-proxy/nginx.conf

          # Create docker-compose.yml
          cat > nginx-proxy/docker-compose.yml <<'EOF'
          services:
            nginx:
              image: nginx:alpine
              container_name: nginx-reverse-proxy
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx.conf:/etc/nginx/nginx.conf:ro
                - ./certs:/etc/nginx/certs:ro
              networks:
                - msngr-network
              extra_hosts:
                - "host.docker.internal:host-gateway"

          networks:
            msngr-network:
              external: true
          EOF

          # Start Nginx
          cd nginx-proxy
          docker compose down --remove-orphans || true
          docker compose up -d

          sleep 5

          # Verify Nginx started
          if docker ps | grep -q nginx-reverse-proxy; then
            echo "Nginx started successfully"
            docker logs nginx-reverse-proxy --tail 10
          else
            echo "Nginx failed to start"
            docker logs nginx-reverse-proxy || true
            exit 1
          fi

      - name: Verify Deployment
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
        run: |
          sleep 10

          echo "=========================================="
          echo "✅ DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo "🌐 Frontend URL: https://$PUBLIC_IP"
          echo "Auth API: https://$PUBLIC_IP/api/v1/auth"
          echo "Profile API: https://$PUBLIC_IP/api/v1/profile"
          echo "Message API: https://$PUBLIC_IP/api/v1/messages"
          echo ""
          echo "Self-signed certificate - browser will show warning"
          echo "=========================================="
          echo ""
          echo "Running containers:"
          docker ps --format "table {{.Names}}\t{{.Status}}"

          echo ""
          echo "Testing endpoints:"
          curl -k -I https://$PUBLIC_IP 2>&1 | head -3

          echo ""
          echo "API Test:"
          curl -k https://$PUBLIC_IP/api/v1/auth/health 2>&1 || echo "Health endpoint may not exist"