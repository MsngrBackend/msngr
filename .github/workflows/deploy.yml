name: Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: Deploy vars

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # STEP 1: Issue Let's Encrypt IP certificate
      - name: Issue Let's Encrypt IP Certificate
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
          EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          if [ ! -d "$HOME/.acme.sh" ]; then
            curl https://get.acme.sh | sh -s email=$EMAIL
          fi

          export PATH="$HOME/.acme.sh:$PATH"
          mkdir -p ./nginx-proxy/certs

          ~/.acme.sh/acme.sh --issue --server letsencrypt \
            -d $PUBLIC_IP \
            --certificate-profile shortlived \
            --standalone \
            --force

          ~/.acme.sh/acme.sh --install-cert -d $PUBLIC_IP \
            --cert-file ./nginx-proxy/certs/cert.pem \
            --key-file ./nginx-proxy/certs/key.pem \
            --fullchain-file ./nginx-proxy/certs/fullchain.pem

          chmod 644 ./nginx-proxy/certs/*.pem

      # STEP 2: Setup Nginx reverse proxy (handles HTTPS)
      - name: Setup Nginx Reverse Proxy
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
        run: |
          mkdir -p nginx-proxy

          cat > nginx-proxy/nginx.conf <<'EOF'
          events {
              worker_connections 1024;
          }

          http {
              # Your microservices (unchanged, still using HTTP internally)
              upstream auth_service {
                  server auth-service:8081;
              }

              upstream frontend_service {
                  server frontend:80;
              }

              # HTTPS server - handles all encryption
              server {
                  listen 443 ssl http2;
                  server_name PUBLIC_IP_PLACEHOLDER;

                  ssl_certificate /etc/nginx/certs/fullchain.pem;
                  ssl_certificate_key /etc/nginx/certs/key.pem;

                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_ciphers HIGH:!aNULL:!MD5;

                  # Forward API requests to auth service (still HTTP internally)
                  location /api/auth/ {
                      proxy_pass http://auth_service/;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  # Forward frontend requests
                  location / {
                      proxy_pass http://frontend_service/;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }

              # Redirect HTTP to HTTPS
              server {
                  listen 80;
                  server_name PUBLIC_IP_PLACEHOLDER;
                  return 301 https://$server_name$request_uri;
              }
          }
          EOF

          sed -i "s/PUBLIC_IP_PLACEHOLDER/$PUBLIC_IP/g" nginx-proxy/nginx.conf

          cat > nginx-proxy/docker-compose.yml <<'EOF'
          version: '3.8'

          services:
            nginx:
              image: nginx:alpine
              container_name: nginx-reverse-proxy
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx.conf:/etc/nginx/nginx.conf:ro
                - ./certs:/etc/nginx/certs:ro
              networks:
                - app_network

          networks:
            app_network:
              external: true
          EOF

          cd nginx-proxy
          docker compose down --remove-orphans || true
          docker compose up -d

      - name: Create .env files from secrets
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
        run: |
          cat > auth-service/.env <<'EOF'
          HTTP_PORT=8081
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=${{ secrets.AUTH_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.AUTH_POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.AUTH_POSTGRES_DB }}
          POSTGRES_SSLMODE=disable
          REDIS_ADDR=redis:6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DB=0
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_ACCESS_TTL=15m
          JWT_REFRESH_TTL=720h
          EMAIL_CODE_TTL=15m
          PROFILE_SERVICE_URL=http://profile-service:8082
          MESSAGE_SERVICE_URL=http://message-service:8083
          EOF

          cat > message-service/.env <<'EOF'
          POSTGRES_DB=${{ secrets.MESSAGE_POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.MESSAGE_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.MESSAGE_POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://${{ secrets.MESSAGE_POSTGRES_USER }}:${{ secrets.MESSAGE_POSTGRES_PASSWORD }}@messaging_postgres:5432/${{ secrets.MESSAGE_POSTGRES_DB }}
          EOF

          cat > profile-service/.env <<'EOF'
          POSTGRES_USER=${{ secrets.PROFILE_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.PROFILE_POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.PROFILE_POSTGRES_DB }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          EOF

          # frontend - ONLY change: use HTTPS for API calls
          cat > frontend/.env <<'EOF'
          VITE_API_URL=https://$PUBLIC_IP/api/auth
          VITE_WS_URL=wss://$PUBLIC_IP/api/auth
          EOF

      # STEP 4: Create Docker network
      - name: Create Docker network
        run: |
          docker network inspect app_network >/dev/null 2>&1 || docker network create app_network

      # STEP 5: Deploy all services (unchanged from your original)
      - name: Deploy profile-service
        run: |
          cd profile-service
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Deploy message-service
        run: |
          cd message-service
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Deploy auth-service
        run: |
          cd auth-service
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Deploy frontend
        run: |
          cd frontend
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Verify deployment
        env:
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
        run: |
          sleep 10
          echo "Deployment complete!"
          echo "Frontend: https://$PUBLIC_IP"
          echo "API Gateway: https://$PUBLIC_IP/api/auth"
